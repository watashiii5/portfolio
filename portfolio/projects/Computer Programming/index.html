<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POS System Showcase</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #8DB600; /* Apple green */
      font-family: Arial, sans-serif;
      color: #fff;
      position: relative;
    }

    .container {
      max-width: 1000px;
      margin: 60px auto 40px auto; /* extra top margin for Home button */
      background-color: rgba(0, 0, 0, 0.1);
      padding: 20px;
      border-radius: 12px;
    }

    h1, p {
      text-align: center;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2 columns */
      gap: 15px;
      margin: 20px 0;
    }

    .image-grid a {
      display: block;
      border-radius: 10px;
      overflow: hidden;
    }

    .image-grid a:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .image-grid img {
      width: 100%;
      border-radius: 10px;
      border: 2px solid white;
      cursor: zoom-in;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.86);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .lightbox[hidden] {
      display: none;
    }

    .lightbox__panel {
      width: min(1100px, 96vw);
      max-height: 90vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.30);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .lightbox__bar {
      display: flex;
      justify-content: flex-end;
    }

    .lightbox__close {
      background-color: white;
      color: #8DB600;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .lightbox__close:hover {
      background-color: #f0f0f0;
    }

    .lightbox__imgWrap {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.30);
    }

    .lightbox__img {
      max-width: 100%;
      max-height: 78vh;
      width: auto;
      height: auto;
      border-radius: 10px;
    }

    .pdf-container {
      margin-top: 40px;
      text-align: center;
    }

    .pdf-container iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 10px;
    }

    .fallback {
      margin-top: 10px;
      color: #333;
    }

    /* Home Button */
    .home-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: white;
      color: #8DB600;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .home-button:hover {
      background-color: #f0f0f0;
    }

    /* Back Button */
    .back-button {
      display: block;
      width: fit-content;
      margin: 40px auto 0 auto;
      background-color: white;
      color: #8DB600;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .back-button:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <!-- Home Button -->
  <a href="../../../index.html" class="home-button">Home</a>

  <div class="container">
    <h1>POS System Project</h1>
    <p>Here's how our Point of Sale using <b>Java (Netbeans), MySQL and PHP</b> as an database and how system works in action, along with screenshots and documentation.</p>

    <div class="image-grid">
      <a href="1.png" data-lightbox aria-label="Open POS screenshot 1"><img src="1.png" alt="POS Screenshot 1"></a>
      <a href="4.png" data-lightbox aria-label="Open POS screenshot 2"><img src="4.png" alt="POS Screenshot 2"></a>
      <a href="3.png" data-lightbox aria-label="Open POS screenshot 3"><img src="3.png" alt="POS Screenshot 3"></a>
      <a href="2.png" data-lightbox aria-label="Open POS screenshot 4"><img src="2.png" alt="POS Screenshot 4"></a>
      <a href="5.png" data-lightbox aria-label="Open POS screenshot 5"><img src="5.png" alt="POS Screenshot 5"></a>
      <a href="6.png" data-lightbox aria-label="Open POS screenshot 6"><img src="6.png" alt="POS Screenshot 6"></a>
    </div>

    <div class="pdf-container">
      <h2>Project Documentation</h2>
      <iframe src="POS Project.pdf"></iframe>
      <div class="fallback">
        <p>If the PDF does not load, <a href="POS Project.pdf" target="_blank" style="color: #ff0;">click here to view it manually</a>.</p>
      </div>
    </div>
  </div>

  <!-- Back Button -->
  <a href="javascript:history.back()" class="back-button">Back</a>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <div class="lightbox__panel" role="document">
      <div class="lightbox__bar">
        <button id="lightboxClose" class="lightbox__close" type="button">Close</button>
      </div>
      <div class="lightbox__imgWrap">
        <img id="lightboxImg" class="lightbox__img" alt="" />
      </div>
    </div>
  </div>

  <script>
    (function () {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const closeBtn = document.getElementById('lightboxClose');
      let lastFocused = null;

      function openLightbox(src, alt) {
        lastFocused = document.activeElement;
        lightboxImg.src = src;
        lightboxImg.alt = alt || 'Preview image';
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        closeBtn.focus();
      }

      function closeLightbox() {
        lightbox.hidden = true;
        lightboxImg.src = '';
        document.body.style.overflow = '';
        if (lastFocused && typeof lastFocused.focus === 'function') {
          lastFocused.focus();
        }
      }

      document.addEventListener('click', function (e) {
        const link = e.target.closest('a[data-lightbox]');
        if (!link) return;
        const img = link.querySelector('img');
        e.preventDefault();
        openLightbox(link.getAttribute('href'), img ? img.alt : 'Preview image');
      });

      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', function (e) {
        if (lightbox.hidden) return;
        if (e.key === 'Escape') closeLightbox();
      });
    })();
  </script>


</body>
</html>
